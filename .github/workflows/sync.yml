name: Scrape lom.bg

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run scrape
        run: npm run sync --prefix server
